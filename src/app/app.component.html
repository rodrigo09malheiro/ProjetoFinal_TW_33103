@if (isLoggedIn) {
  <nav class="navbar">
    <div class="nav-brand" (click)="goTo('games')" (keyup.enter)="goTo('games')" tabindex="0" role="button">
      🎮 GameDex
    </div>
    <div class="nav-links">
      <button (click)="goTo('games')">Jogos</button>
      <button (click)="goTo('profile')">👤 {{ username }}</button>
      <button class="btn-dark" (click)="toggleDarkMode()">
        {{ isDarkMode ? '🌙' : '☀️' }}
      </button>
      <button class="btn-logout" (click)="logout()">🚪 Sair</button>
    </div>
  </nav>
}

<router-outlet />

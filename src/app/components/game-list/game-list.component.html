<div class="container">
  <h1>🎮 Game Library</h1>

  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="Pesquisar jogos..."
      (keyup.enter)="onSearch()"
    />
    <button (click)="onSearch()">Pesquisar</button>
  </div>

  <div class="filters">
    <select [(ngModel)]="selectedGenre" (change)="onFilterChange()">
      <option value="">🎭 Todos os géneros</option>
      @for (genre of genres; track genre.id) {
        <option [value]="genre.id">{{ genre.name }}</option>
      }
    </select>

    <select [(ngModel)]="selectedPlatform" (change)="onFilterChange()">
      <option value="">🖥️ Todas as plataformas</option>
      @for (platform of platforms; track platform.id) {
        <option [value]="platform.id">{{ platform.name }}</option>
      }
    </select>

    @if (selectedGenre || selectedPlatform || searchQuery) {
      <button class="btn-clear" (click)="clearFilters()">✕ Limpar filtros</button>
    }
  </div>

  @if (isLoading) {
    <div class="loading">A carregar jogos...</div>
  }

  @if (!isLoading) {
    <div class="games-grid">
      @for (game of games; track game.id) {
        <div
          class="game-card"
          (click)="goToDetail(game.id)"
          (keyup.enter)="goToDetail(game.id)"
          tabindex="0"
          role="button"
        >
          <img [src]="game.background_image" [alt]="game.name" />
          <div class="game-info">
            <h3>{{ game.name }}</h3>
            <p>⭐ {{ game.rating }}</p>
            <p>📅 {{ game.released }}</p>
          </div>
        </div>
      }
    </div>
  }

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="currentPage === 1">← Anterior</button>

    <div class="page-info">
      <span>Página {{ currentPage }} de {{ totalPages }}</span>
      <div class="jump">
        <input
          type="number"
          [(ngModel)]="jumpToPage"
          [min]="1"
          [max]="totalPages"
          (keyup.enter)="onJumpToPage()"
        />
        <button (click)="onJumpToPage()">Ir</button>
      </div>
    </div>

    <button (click)="nextPage()" [disabled]="currentPage === totalPages">Próxima →</button>
  </div>
</div>
